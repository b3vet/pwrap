[project]
name = "pwrap"
version = "0.1.0"
description = "Python SDK for pwrap — Postgres-backed all-in-one backend."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Berke Ucvet" }]
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
# >=77 for PEP 639 SPDX license expressions; the `license = {text = ...}` table
# form is deprecated and warns on every build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pwrap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
