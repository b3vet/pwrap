name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: test (unit)
        run: go test ./... -race -count=1
      - name: build
        run: |
          go build ./cmd/pwrapd
          go build ./cmd/pwrap

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: build pwrap-postgres image
        run: docker compose build postgres
      - name: testcontainers integration suite
        run: go test -tags integration ./internal/integration/... -count=1 -v

  # Runs the same scenarios through all three SDKs against one live stack, then
  # gates on conformance/check.py. This is what keeps the SDKs honest about
  # parity: a scenario an SDK declares but doesn't cover fails the build.
  conformance:
    runs-on: ubuntu-latest
    # A hung suite must fail with logs rather than burn a runner for six hours.
    # The whole thing takes about four minutes; 20 is generous.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install python sdk
        run: pip install -e sdk/py
      - name: build pwrap-postgres image
        run: docker compose build postgres
      - name: build binaries
        run: make build
      - name: conformance suite
        env:
          CI: "true"
        run: ./conformance/run.sh
      - name: stack logs on failure
        if: failure()
        run: |
          echo "--- pwrapd ---"
          tail -100 conformance/.reports/pwrapd.log 2>/dev/null || echo "(no pwrapd log)"
          echo "--- containers ---"
          docker compose ps || true
          docker compose logs --tail 100 || true
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: conformance/.reports/
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # golangci-lint v2 is required: v1 binaries are built with Go 1.23 and
      # refuse to load a module targeting a newer Go version than themselves.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines >= 18, and the two versions differ in a
        # way that matters: Node 22 provides a global WebSocket, Node 20 does
        # not. Building on both keeps that promise honest.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pwrap (editable) + dev deps
        run: pip install -e sdk/py pytest pytest-asyncio
      - name: import smoke
        run: python -c "import pwrap; print('pwrap', pwrap.SCHEMA_VERSION)"
      # These skip when pwrapd isn't reachable, so this only proves the suite is
      # collectable. The conformance job is what actually exercises the SDK.
      # Scoped with working-directory rather than `cd` — a `cd` on one line of a
      # multi-line run block leaks into the next, which is how this job came to
      # invoke pytest against sdk/py/sdk/py.
      - name: pytest (collection + skips)
        working-directory: sdk/py
        run: python -m pytest -q
