version: 2
updates:
  # Control plane + CLI
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      otel:
        patterns: ["go.opentelemetry.io/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]

  # Go SDK is its own module and is published separately — keep its deps
  # conservative so downstream apps don't inherit churn.
  - package-ecosystem: gomod
    directory: "/sdk/go"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/sdk/ts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directory: "/sdk/py"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/docker/postgres"
    schedule:
      interval: monthly
