name: Feature request
description: Suggest a capability or a change to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: |
        Describe the situation, not the solution. What are you building, and
        where does pwrap get in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you have an API shape in mind, sketch it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do it outside pwrap" — that's often the right answer.

  - type: checkboxes
    id: parity
    attributes:
      label: SDK surface
      description: If this adds a client-side capability, which SDKs should have it? They're kept at parity.
      options:
        - label: Go
        - label: TypeScript
        - label: Python
        - label: Not an SDK change
